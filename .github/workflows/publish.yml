name: Validate and publish signed packs

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: signed-pack-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ANYGO_PACK_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check cryptography==45.0.6
      - name: Configure publication identity
        run: |
          git config user.name "AnyGo Pack Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Refresh bounded ONE catalogue metadata
        run: |
          python -m tools.marker_pipeline.generate_catalogue --network --source source/clip-db.json --workers 6 --timeout 12 --retries 2
          python -m tools.marker_pipeline.generate_markers
          python -m tools.marker_pipeline.generate_clips --resume
          python -m tools.marker_pipeline.validate_outputs
          python scripts/build_app_pack.py
          python -m unittest discover -s tools/marker_pipeline/tests -t .
      - name: Validate and publish atomically
        env:
          ANYGO_ED25519_PRIVATE_KEY_B64: ${{ secrets.ANYGO_ED25519_PRIVATE_KEY_B64 }}
        run: python scripts/publish_release.py
